# Configuración de producción: sirve la SPA y proxya la API y los websockets
# al servicio backend de la red de docker compose (mismo origen → sin CORS).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión básica
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # N3.5: el sitemap lo genera el backend desde la configuración
  location = /sitemap.xml {
    proxy_pass http://backend:4000/sitemap.xml;
    proxy_set_header Host $host;
  }

  # SPA fallback (BUG-30: equivalente a la regla _redirects de Netlify/Render)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
