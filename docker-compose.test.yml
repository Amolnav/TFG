# Base de datos efímera para la suite de integración (T2).
# Uso:   docker compose -f docker-compose.test.yml up -d
#        cd backend && npm run test:integration
#        docker compose -f docker-compose.test.yml down
services:
  test-db:
    image: postgres:16
    container_name: resto_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: resto_test
    ports:
      - "127.0.0.1:5434:5432"
    # Datos en memoria: rápida y sin estado entre ejecuciones
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
