# T5: integración continua — lint + tests + build de ambos paquetes en cada
# push/PR, con la suite de integración contra PostgreSQL real y un job E2E
# aparte contra el stack de docker compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + unit + integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: resto_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5434/resto_test

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: E2E (Playwright contra docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar db + backend
        run: docker compose up -d db backend
      - name: Esperar al backend y sembrar datos
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 2
          done
          docker compose exec -T backend npm run db:seed
      - name: Instalar frontend y Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ejecutar E2E
        working-directory: frontend
        run: npx playwright test
      - name: Apagar stack
        if: always()
        run: docker compose down
